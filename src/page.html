<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickCam Express</title>
<style>
  :root { color-scheme: light dark; font: 13px -apple-system, system-ui, sans-serif; }
  body { margin: 0; padding: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  h1 { font-size: 15px; margin: 0 0 12px; }
  #video { background: #000; border-radius: 8px; overflow: hidden; width: 704px; max-width: 100%;
           aspect-ratio: 352 / 288; }
  #video img { width: 100%; height: 100%; object-fit: contain; display: block; }
  #status { color: GrayText; margin: 8px 0 0; font-variant-numeric: tabular-nums; }
  form { width: 320px; display: grid; grid-template-columns: 110px 1fr 44px; gap: 10px 8px; align-items: center; }
  .wide { grid-column: 1 / -1; }
  .sub { padding-left: 12px; }
  output { text-align: right; font-variant-numeric: tabular-nums; color: GrayText; }
  input[type=range] { width: 100%; }
  .buttons { display: flex; gap: 8px; margin-top: 6px; }
  .buttons a, .buttons button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid #8884;
                                background: ButtonFace; color: ButtonText; text-decoration: none; cursor: pointer; }
  .hint { color: GrayText; line-height: 1.6; margin: 10px 0 0; }
  code { user-select: all; }
</style>
</head>
<body>
<div>
  <div id="video"><img id="feed" src="/stream.mjpg" alt="QuickCam live feed"></div>
  <p id="status">connecting…</p>
</div>
<form id="panel" onsubmit="return false">
  <h1 class="wide">QuickCam Express</h1>

  <label for="size">Size</label>
  <select id="size">
    <option value="352x288">352 × 288</option>
    <option value="320x240">320 × 240</option>
    <option value="176x144">176 × 144</option>
    <option value="160x120">160 × 120</option>
  </select><span></span>

  <label for="auto_exposure">Auto exposure</label><input type="checkbox" id="auto_exposure"><span></span>
  <label for="exposure" class="sub">Exposure</label><input type="range" id="exposure" min="1" max="2372"><output></output>
  <label for="gain" class="sub">Gain</label><input type="range" id="gain" min="0" max="255"><output></output>

  <label for="auto_white_balance">Auto white bal.</label><input type="checkbox" id="auto_white_balance"><span></span>
  <label for="brightness">Brightness</label><input type="range" id="brightness" min="-64" max="64"><output></output>
  <label for="gamma">Gamma</label><input type="range" id="gamma" min="0.8" max="3" step="0.1"><output></output>
  <label for="saturation">Saturation</label><input type="range" id="saturation" min="0" max="2.5" step="0.1"><output></output>
  <label for="quality">JPEG quality</label><input type="range" id="quality" min="0.4" max="1" step="0.05"><output></output>

  <div class="wide buttons">
    <a href="/snapshot.jpg" download="QuickCam.jpg">Snapshot</a>
    <button type="button" id="reset">Reset to defaults</button>
  </div>
  <p class="wide hint">
    OBS Browser source: <code id="url-video"></code><br>
    OBS Media source or VLC: <code id="url-stream"></code>
  </p>
</form>
<script>
const ids = ['size', 'auto_exposure', 'exposure', 'gain', 'auto_white_balance', 'brightness', 'gamma',
             'saturation', 'quality'];
const $ = id => document.getElementById(id);
let editedAt = 0;  // don't overwrite controls while the user is dragging them
const timers = {};

$('url-video').textContent = `${location.origin}/video`;
$('url-stream').textContent = `${location.origin}/stream.mjpg`;

function showValue(el) {
  const out = el.nextElementSibling;
  if (out && out.tagName === 'OUTPUT') out.textContent = el.value;
}

function show(s) {
  if (Date.now() - editedAt > 1500) {
    for (const id of ids) {
      const el = $(id), v = id === 'size' ? `${s.width}x${s.height}` : s[id];
      if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
      showValue(el);
    }
  }
  $('status').textContent = s.running
    ? `${s.width}×${s.height} · ${s.fps.toFixed(1)} fps · exposure ${s.exposure} · gain ${s.gain}` +
      ` · white balance r ${s.wb_r.toFixed(2)} b ${s.wb_b.toFixed(2)}`
    : (s.error || 'camera idle');
}

async function send(query) {
  editedAt = Date.now();
  const r = await fetch(`/api/set?${query}`, {method: 'POST'});
  if (r.ok) show(await r.json());
}

for (const id of ids) {
  const el = $(id);
  el.addEventListener('input', () => {
    editedAt = Date.now();
    showValue(el);
    clearTimeout(timers[id]);
    const v = el.type === 'checkbox' ? (el.checked ? 1 : 0) : el.value;
    timers[id] = setTimeout(() => send(`${id}=${encodeURIComponent(v)}`), 80);
  });
}
$('reset').addEventListener('click', () => { editedAt = 0; send('reset=1'); });

async function poll() {
  try {
    const r = await fetch('/api/controls');
    if (r.ok) show(await r.json());
  } catch (e) {
    $('status').textContent = 'qcserve is not running';
  }
  setTimeout(poll, 1000);
}
poll();

// Reconnect the feed if the server restarts.
$('feed').addEventListener('error', () => setTimeout(() => { $('feed').src = `/stream.mjpg?${Date.now()}`; }, 1000));
</script>
</body>
</html>
